<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentHouse</title>
    <link rel="icon" href="static/icon.jpeg" type="img/jpeg">
    <link rel="stylesheet" href="{{ url_for('static', filename='renthouse.css') }}">
</head>
<body>

    <div class="wrapper">
        <form action="/index" method="POST">
            <h1>Iniciar sesión</h1>

            {% if error %}
                <div class="error-msg">{{ error }}</div>
            {% endif %}

            <div class="input-box">
                <input type="text" name="usuario" placeholder="Correo" required>
                <i class="bx bxs-user"></i>
            </div>

            <div class="input-box">
                <input type="password" name="contraseña" placeholder="Contraseña" required>
                <i class="bx bxs-lock-alt"></i>
            </div>
            <div class="register-link">
                <i> <p>¿Has olvidado la contraseña? <a href="/contraseña">Recuperar contraseña</a></p>
            </div><br></i> 
            <button type="submit" class="btn">Entrar</button>

            <div class="register-link">
               <i><p>¿No tienes cuenta? <a href="/registro">Regístrate</a></p></i> 
            </div>
        </form>
    </div>

</body>
</html>
